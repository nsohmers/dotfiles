# --- core behavior ---
set -sg escape-time 0            # or Esc lags in nvim
set -g focus-events on           # nvim autoread + file watchers
set -g base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g set-clipboard on          # OSC 52: yanks reach the local clipboard over SSH too
set -g mode-keys vi              # hjkl/v/y in copy-mode instead of emacs bindings
set -g mouse on                  # click to select a pane, drag to resize, scroll to enter copy-mode
# Ctrl+Alt+letter has no unambiguous legacy escape sequence; this makes tmux request
# modern extended-key reporting from the outer terminal so combos like C-M-h actually
# arrive as a distinct key instead of nothing (or colliding with something else).
# "always" instead of "on" because tmux's bundled terminal database doesn't know Ghostty
# specifically, so it won't auto-detect support otherwise.
set -s extended-keys always

# Smart pane switching with awareness of Vim splits.
# Ctrl+Alt (not plain Alt) because AeroSpace already claims plain alt-h/j/k/l for
# OS-window focus, and plain Ctrl-h/j/k/l risks colliding with Backspace (^H).
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-M-h' if-shell "$is_vim" 'send-keys C-M-h'  'select-pane -L'
bind-key -n 'C-M-j' if-shell "$is_vim" 'send-keys C-M-j'  'select-pane -D'
bind-key -n 'C-M-k' if-shell "$is_vim" 'send-keys C-M-k'  'select-pane -U'
bind-key -n 'C-M-l' if-shell "$is_vim" 'send-keys C-M-l'  'select-pane -R'
bind-key -n 'C-M-\' if-shell "$is_vim" 'send-keys C-M-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-M-h' select-pane -L
bind-key -T copy-mode-vi 'C-M-j' select-pane -D
bind-key -T copy-mode-vi 'C-M-k' select-pane -U
bind-key -T copy-mode-vi 'C-M-l' select-pane -R
bind-key -T copy-mode-vi 'C-M-\' select-pane -l

# --- session / project management ---
bind-key f run-shell "tmux neww ~/.local/bin/tmux-sessionizer" # fuzzy-find & switch to a project session
bind-key L switch-client -l                                    # jump to last session
bind-key R respawn-pane -k                                     # restart a dead pane, keep the layout

# --- popups ---
bind-key g display-popup -E -w 90% -h 90% "lazygit"
bind-key t display-popup -E -w 80% -h 70%

# --- nested tmux passthrough (local tmux + remote tmux both want the prefix) ---
bind -T root F12 set prefix None \; set key-table off \; refresh-client -S
bind -T off F12  set -u prefix   \; set -u key-table \; refresh-client -S

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fcsonline/tmux-thumbs'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
