# ~/.aerospace.toml

config-version = 2
# v1 auto-inferred this from the workspace bindings below; v2 dropped that inference,
# so it's spelled out explicitly to keep workspaces 1-9 persistent as before.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

start-at-login = true

# i3-like: new windows join the focused container
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Don't let macOS native fullscreen escape the tiler
automatically-unhide-macos-hidden-apps = true

[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.right      = 8
outer.top        = 8
outer.bottom     = 8

[mode.main.binding]

# --- app launchers ---
alt-t = 'exec-and-forget open -na Ghostty'
alt-f = 'exec-and-forget /Applications/Firefox.app/Contents/MacOS/firefox --new-window'
alt-e = 'exec-and-forget osascript -e "tell application \"Finder\" to make new Finder window" -e "tell application \"Finder\" to activate"'

# --- focus ---
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# --- move windows ---
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- window actions ---
alt-u = 'fullscreen'
alt-v = 'layout floating tiling'
alt-q = 'close --quit-if-last-window' # otherwise the app stays resident with no windows, leaking RAM

# --- layout toggles (useful, i3 habits) ---
alt-w = 'layout tiles horizontal vertical'
alt-s = 'layout accordion horizontal vertical'

# --- workspaces ---
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# --- move to workspace AND follow ---
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# --- resize ---
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# --- reload ---
alt-shift-ctrl-e = 'exec-and-forget pkill -x AeroSpace'

alt-shift-r = 'reload-config'
alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'

shift-h = 'resize width -10'
shift-j = 'resize height +10'
shift-k = 'resize height -10'
shift-l = 'resize width +10'

minus = 'resize smart -50'
equal = 'resize smart +50'

enter = 'mode main'
esc = 'mode main'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = 'Info'
run = 'layout floating'
